<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dryFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="resinCoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="coreSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="busbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dryShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark Engineering Background -->
  <rect width="800" height="600" fill="#09131f" rx="20"/>

  <!-- Protective IP33 Enclosure Cage Frame (Semi-transparent) -->
  <rect x="140" y="80" width="520" height="460" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10,8" opacity="0.4"/>
  <rect x="130" y="520" width="540" height="25" rx="6" fill="#1e293b"/>

  <!-- Perforated Ventilation Louvres on Enclosure Corners -->
  <g fill="#0284c7" opacity="0.3">
    <rect x="150" y="110" width="80" height="6" rx="3"/>
    <rect x="150" y="125" width="80" height="6" rx="3"/>
    <rect x="150" y="140" width="80" height="6" rx="3"/>
    <rect x="150" y="155" width="80" height="6" rx="3"/>
    
    <rect x="570" y="110" width="80" height="6" rx="3"/>
    <rect x="570" y="125" width="80" height="6" rx="3"/>
    <rect x="570" y="140" width="80" height="6" rx="3"/>
    <rect x="570" y="155" width="80" height="6" rx="3"/>
  </g>

  <!-- Heavy CRGO Core Clamping Structure -->
  <!-- Top Yoke Clamp -->
  <rect x="200" y="160" width="400" height="50" rx="6" fill="url(#coreSteel)" filter="url(#dryShadow)"/>
  <!-- Bottom Yoke Clamp -->
  <rect x="200" y="440" width="400" height="50" rx="6" fill="url(#coreSteel)" filter="url(#dryShadow)"/>
  <!-- Tie Rods Clamping Top & Bottom -->
  <line x1="220" y1="160" x2="220" y2="490" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="580" y1="160" x2="580" y2="490" stroke="#cbd5e1" stroke-width="8"/>

  <!-- Three Epoxy Cast Resin Coils (Phases U, V, W) -->
  <!-- Phase U (Left) -->
  <g filter="url(#dryShadow)">
    <rect x="240" y="200" width="95" height="250" rx="18" fill="url(#resinCoil)"/>
    <ellipse cx="287" cy="200" rx="47" ry="12" fill="#ef4444"/>
    <ellipse cx="287" cy="450" rx="47" ry="12" fill="#991b1b"/>
    <!-- Cooling Ducts lines -->
    <line x1="255" y1="220" x2="255" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.5"/>
    <line x1="287" y1="220" x2="287" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.6"/>
    <line x1="320" y1="220" x2="320" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.5"/>
    <text x="287" y="335" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">U</text>
  </g>

  <!-- Phase V (Center) -->
  <g filter="url(#dryShadow)">
    <rect x="352" y="200" width="95" height="250" rx="18" fill="url(#resinCoil)"/>
    <ellipse cx="400" cy="200" rx="47" ry="12" fill="#ef4444"/>
    <ellipse cx="400" cy="450" rx="47" ry="12" fill="#991b1b"/>
    <line x1="367" y1="220" x2="367" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.5"/>
    <line x1="400" y1="220" x2="400" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.6"/>
    <line x1="432" y1="220" x2="432" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.5"/>
    <text x="400" y="335" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">V</text>
  </g>

  <!-- Phase W (Right) -->
  <g filter="url(#dryShadow)">
    <rect x="465" y="200" width="95" height="250" rx="18" fill="url(#resinCoil)"/>
    <ellipse cx="512" cy="200" rx="47" ry="12" fill="#ef4444"/>
    <ellipse cx="512" cy="450" rx="47" ry="12" fill="#991b1b"/>
    <line x1="480" y1="220" x2="480" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.5"/>
    <line x1="512" y1="220" x2="512" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.6"/>
    <line x1="545" y1="220" x2="545" y2="430" stroke="#fee2e2" stroke-width="3" opacity="0.5"/>
    <text x="512" y="335" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">W</text>
  </g>

  <!-- Copper Busbar Links (Top connection) -->
  <g fill="url(#busbarGrad)" stroke="#b45309" stroke-width="2">
    <rect x="277" y="115" width="20" height="75" rx="3"/>
    <rect x="390" y="115" width="20" height="75" rx="3"/>
    <rect x="502" y="115" width="20" height="75" rx="3"/>
    <!-- Terminal flags -->
    <rect x="272" y="105" width="30" height="18" rx="2"/>
    <rect x="385" y="105" width="30" height="18" rx="2"/>
    <rect x="497" y="105" width="30" height="18" rx="2"/>
  </g>

  <!-- Temperature PT100 Controller Box -->
  <rect x="160" y="410" width="55" height="70" rx="6" fill="#0f172a" stroke="#00d4ff" stroke-width="2"/>
  <rect x="170" y="420" width="35" height="20" rx="2" fill="#0284c7"/>
  <text x="187" y="434" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">85°C</text>
  <circle cx="178" cy="455" r="4" fill="#22c55e"/>
  <circle cx="196" cy="455" r="4" fill="#ef4444"/>

  <!-- Foundation Wheels / Rollers -->
  <circle cx="250" cy="535" r="14" fill="#64748b"/>
  <circle cx="250" cy="535" r="6" fill="#0f172a"/>
  <circle cx="550" cy="535" r="14" fill="#64748b"/>
  <circle cx="550" cy="535" r="6" fill="#0f172a"/>

  <!-- Badge banner -->
  <rect x="230" y="555" width="340" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="576" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">CAST RESIN DRY TYPE (CRT / VPI) TRANSFORMER</text>
</svg>