<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle electrical grid glow behind portrait -->
  <circle cx="200" cy="180" r="140" fill="#00d4ff" opacity="0.1"/>
  
  <!-- Silhouette of Executive / Engineer -->
  <!-- Shoulders / Suit -->
  <path d="M70 450 C90 320 140 280 200 280 C260 280 310 320 330 450 Z" fill="url(#suitGrad)"/>
  
  <!-- Shirt & Tie -->
  <polygon points="175,280 200,340 225,280" fill="#f8fafc"/>
  <polygon points="193,310 207,310 203,420 197,420" fill="#0b5cff"/>
  
  <!-- Neck -->
  <rect x="175" y="220" width="50" height="70" rx="10" fill="#e2b997"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="170" rx="65" ry="80" fill="#f0cbb0"/>
  
  <!-- Professional Hair -->
  <path d="M130 160 C130 90 270 90 270 160 C260 115 140 115 130 160 Z" fill="#2d3748"/>
  
  <!-- Glasses -->
  <rect x="155" y="155" width="35" height="22" rx="4" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="210" y="155" width="35" height="22" rx="4" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="190" y1="166" x2="210" y2="166" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Confident Smile -->
  <path d="M185 210 Q200 222 215 210" fill="none" stroke="#8c5847" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Badge Pill -->
  <rect x="80" y="390" width="240" height="36" rx="18" fill="rgba(11,92,255,0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="413" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">TECHNICAL DIRECTOR</text>
</svg>