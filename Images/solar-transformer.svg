<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="solarPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="solarTank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#solarBg)" rx="20"/>

  <!-- Background Solar PV Panel Motif -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5">
    <polygon points="60,180 220,120 220,240 60,300" fill="url(#solarPanel)"/>
    <line x1="113" y1="160" x2="113" y2="280"/>
    <line x1="166" y1="140" x2="166" y2="260"/>
    <line x1="60" y1="240" x2="220" y2="180"/>

    <polygon points="580,120 740,180 740,300 580,240" fill="url(#solarPanel)"/>
    <line x1="633" y1="140" x2="633" y2="260"/>
    <line x1="686" y1="160" x2="686" y2="280"/>
    <line x1="580" y1="180" x2="740" y2="240"/>
  </g>

  <!-- Ground Platform -->
  <rect x="180" y="490" width="440" height="30" rx="6" fill="#334155"/>
  <rect x="150" y="520" width="500" height="15" rx="4" fill="#1e293b"/>

  <!-- Solar Multi-Winding Transformer Tank -->
  <rect x="230" y="220" width="340" height="270" rx="14" fill="url(#solarTank)"/>

  <!-- Multiple Radiator Coolers -->
  <g fill="#10b981" opacity="0.8">
    <rect x="160" y="260" width="14" height="180" rx="4"/>
    <rect x="180" y="260" width="14" height="180" rx="4"/>
    <rect x="200" y="260" width="14" height="180" rx="4"/>
    <line x1="150" y1="270" x2="230" y2="270" stroke="#047857" stroke-width="6"/>
    <line x1="150" y1="430" x2="230" y2="430" stroke="#047857" stroke-width="6"/>

    <rect x="585" y="260" width="14" height="180" rx="4"/>
    <rect x="605" y="260" width="14" height="180" rx="4"/>
    <rect x="625" y="260" width="14" height="180" rx="4"/>
    <line x1="570" y1="270" x2="650" y2="270" stroke="#047857" stroke-width="6"/>
    <line x1="570" y1="430" x2="650" y2="430" stroke="#047857" stroke-width="6"/>
  </g>

  <!-- Multiple LV Bushings for Multi-Inverter Inputs -->
  <g fill="#f59e0b">
    <rect x="260" y="190" width="16" height="30" rx="3"/>
    <rect x="290" y="190" width="16" height="30" rx="3"/>
    <rect x="320" y="190" width="16" height="30" rx="3"/>
    <rect x="350" y="190" width="16" height="30" rx="3"/>
  </g>

  <!-- Conservator with Air-Cell / Diaphragm -->
  <rect x="380" y="130" width="180" height="55" rx="27" fill="#047857"/>
  <circle cx="530" cy="157" r="14" fill="#34d399"/>

  <!-- High Voltage 33kV Bushings -->
  <polygon points="460,220 470,160 480,160 490,220" fill="#d97706"/>
  <polygon points="505,220 515,160 525,160 535,220" fill="#d97706"/>
  <circle cx="475" cy="155" r="4" fill="#10b981"/>
  <circle cx="520" cy="155" r="4" fill="#10b981"/>

  <!-- Inverter Cable Cable Box (Front LV Flange) -->
  <rect x="270" y="320" width="260" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="355" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MULTI-INVERTER INPUT FLANGE</text>
  <text x="400" y="380" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Harmonic Restraint &amp; Electrostatic Shielded</text>

  <!-- Label Badge -->
  <rect x="200" y="545" width="400" height="32" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="566" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">SOLAR &amp; WIND INVERTER STEP-UP TRANSFORMER</text>
</svg>